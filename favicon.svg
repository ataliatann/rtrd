<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#f5f5f5" rx="40"/>
  
  <!-- Outer circle border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#0d2f5c" stroke-width="8"/>
  
  <!-- Red dot character (simplified for favicon) -->
  <circle cx="100" cy="85" r="28" fill="#e63946"/>
  
  <!-- Eyes -->
  <circle cx="92" cy="82" r="4" fill="#0d2f5c"/>
  <circle cx="108" cy="82" r="4" fill="#0d2f5c"/>
  
  <!-- Smile -->
  <path d="M 95 90 Q 100 93 105 90" stroke="#0d2f5c" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Arms -->
  <rect x="65" y="95" width="12" height="28" rx="6" fill="#e63946" transform="rotate(-30 71 95)"/>
  <rect x="123" y="95" width="12" height="28" rx="6" fill="#e63946" transform="rotate(30 129 95)"/>
  
  <!-- Legs -->
  <rect x="90" y="115" width="10" height="25" rx="5" fill="#e63946"/>
  <rect x="100" y="115" width="10" height="25" rx="5" fill="#e63946"/>
  
  <!-- Shoes -->
  <rect x="88" y="138" width="14" height="8" rx="4" fill="#f5f5f5" stroke="#0d2f5c" stroke-width="1.5"/>
  <rect x="98" y="138" width="14" height="8" rx="4" fill="#f5f5f5" stroke="#0d2f5c" stroke-width="1.5"/>
  
  <!-- Motion lines (simplified) -->
  <line x1="75" y1="110" x2="60" y2="115" stroke="#6b9bd1" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="125" x2="145" y2="135" stroke="#6b9bd1" stroke-width="2" stroke-linecap="round"/>
</svg>